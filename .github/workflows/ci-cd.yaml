name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/python-web-app:latest
            ${{ secrets.DOCKER_USERNAME }}/python-web-app:${{ github.sha }}

      - name: Update deployment image tag
        run: |
          sed -i 's|image: ${{ secrets.DOCKER_USERNAME }}/python-web-app:.*|image: ${{ secrets.DOCKER_USERNAME }}/python-web-app:${{ github.sha }}|g' k8s/deployment.yaml

      - name: Commit and push updated manifest
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "bot@github.com"
          git commit -am "Update image tag to ${{ github.sha }}"
          git push
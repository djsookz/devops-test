apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-web-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-web-app
  template:
    metadata:
      labels:
        app: python-web-app
    spec:
      containers:
      - name: python-web-app
        image: dimakadocker/python-web-app:latest
        ports:
        - containerPort: 5000
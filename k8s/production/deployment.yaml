apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-web-app-production
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: python-web-app-production
  template:
    metadata:
      labels:
        app: python-web-app-production
    spec:
      containers:
      - name: python-web-app
        image: dimakadocker/python-web-app:latest
        ports:
        - containerPort: 5000
apiVersion: v1
kind: Service
metadata:
  name: python-web-app-production-svc
  namespace: production
spec:
  type: NodePort
  selector:
    app: python-web-app-production
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30083  # Ще отваряш апа на http://localhost:30083 на твоя лаптоп
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-web-app-staging  
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-web-app-staging  
  template:
    metadata:
      labels:
        app: python-web-app-staging  
    spec:
      containers:
      - name: python-web-app
        image: dimakadocker/python-web-app:latest
        ports:
        - containerPort: 5000